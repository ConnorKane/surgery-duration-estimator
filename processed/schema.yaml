  role: feature
  source: missingness indicator for lab_k (1=was missing, median-imputed)
- name: lab_gluc_missing
  dtype: int8
  role: feature
  source: missingness indicator for lab_gluc (1=was missing, median-imputed)
- name: lab_cr_missing
  dtype: int8
  role: feature
  source: missingness indicator for lab_cr (1=was missing, median-imputed)
- name: lab_bun_missing
  dtype: int8
  role: feature
  source: missingness indicator for lab_bun (1=was missing, median-imputed)
- name: lab_alb_missing
  dtype: int8
  role: feature
  source: missingness indicator for lab_alb (1=was missing, median-imputed)
- name: lab_ast_missing
  dtype: int8
  role: feature
  source: missingness indicator for lab_ast (1=was missing, median-imputed)
